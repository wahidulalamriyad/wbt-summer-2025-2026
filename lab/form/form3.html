<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create your account</title>
  <link rel="stylesheet" href="form3.css">
</head>

<body>
  <form class="card">
    <header class="card-header">
      <h1>Create your account</h1>
      <p>Join us in a couple of steps.</p>
    </header>

    <div class="field">
      <label for="name">Full name</label>
      <input type="text" id="name" placeholder="Jane Doe">
    </div>

    <div class="field">
      <label for="age">Age</label>
      <input type="number" id="age" placeholder="28">
    </div>

    <div class="field">
      <label for="dob">Date of birth</label>
      <input type="date" id="dob" value="2026-06-25">
    </div>

    <div class="field">
      <label for="email">Email address</label>
      <input type="email" id="email" placeholder="jane@example.com">
    </div>

    <div class="field">
      <label for="password">Password</label>
      <input type="password" id="password" value="password">
    </div>

    <div class="field">
      <p class="group-label">Preferred contact</p>
      <div class="radios">
        <label><input type="radio" name="contact" checked> Email</label>
        <label><input type="radio" name="contact"> Phone</label>
        <label><input type="radio" name="contact"> SMS</label>
      </div>
    </div>

    <div class="buttons">
      <button type="submit" class="btn-primary">Submit</button>
      <button type="reset" class="btn-secondary">Reset</button>
    </div>
  </form>
</body>

</html>
