<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create your workspace</title>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="form1.css">
</head>

<body>
  <form class="card">
    <div class="card-header">
      <p class="eyebrow"><span class="dot"></span>Get Started</p>
      <h1>Create your workspace</h1>
    </div>

    <div class="card-body">
      <div class="field">
        <label for="name">Full name</label>
        <input type="text" id="name" placeholder="Jane Doe">
      </div>

      <div class="field">
        <label for="phone">Phone number</label>
        <input type="number" id="phone" placeholder="5551234567">
      </div>

      <div class="field">
        <label for="dob">Date of birth</label>
        <input type="date" id="dob" value="2026-06-25">
      </div>

      <div class="field">
        <label for="email">Work email</label>
        <input type="email" id="email" placeholder="jane@company.com">
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="At least 8 characters">
      </div>

      <label class="check">
        <input type="checkbox" checked>
        <span>Email me product updates and tips</span>
      </label>

      <label class="check">
        <input type="checkbox">
        <span>I agree to the Terms &amp; Privacy Policy</span>
      </label>

      <div class="buttons">
        <button type="submit" class="btn-primary">Create workspace</button>
        <button type="reset" class="btn-secondary">Reset</button>
      </div>
    </div>
  </form>
</body>

</html>
